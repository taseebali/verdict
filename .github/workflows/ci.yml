name: CI

on:
  push:
    branches: [main, "2.0"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t verdict .
      - run: docker run -d -p 7860:7860 --name verdict verdict
      - run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/api/health && exit 0
            sleep 2
          done
          docker logs verdict
          exit 1
      - run: curl -fs http://localhost:7860/ | grep -q "<title>Verdict</title>"
