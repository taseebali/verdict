name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::HF_TOKEN secret or HF_SPACE variable not set — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Gradio-SDK Spaces (free CPU) have no Node, so ship the built UI with the app.
      - name: Build frontend
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Push to Space
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Spaces reject binaries pushed without LFS: drop docs/ and point README images at GitHub.
          git rm -r -q --ignore-unmatch docs
          sed -i "s#](docs/screenshots/#](https://raw.githubusercontent.com/${REPO}/main/docs/screenshots/#g" README.md
          # Gradio SDK (free tier): HF installs gradio + requirements.txt and runs `python app.py`,
          # which starts our FastAPI server on 7860. gradio 5.50.0 is compatible with our fastapi pin.
          {
            printf -- '---\ntitle: Verdict\nemoji: "⚖️"\ncolorFrom: red\ncolorTo: gray\nsdk: gradio\nsdk_version: 5.50.0\npython_version: "3.12"\napp_file: app.py\npinned: false\n---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          # Orphan commit: no parents, so neither the shallow history nor old PNGs get pushed.
          git checkout -q --orphan space-deploy
          git add -A
          git add -f frontend/dist
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space-deploy:main
